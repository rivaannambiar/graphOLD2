<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Graph Studio</title>
    <meta
      name="description"
      content="Make animated graphs, share them with a link, and build them together live."
    />
    <meta name="theme-color" content="#121218" />
    <script>
      /* Works out where Graph Studio lives, so pretty links like
       /graph/johncenagrades2025/preview still load css/ and js/. */
      (function () {
        var keys = ["graph", "studio", "community", "u", "view"];
        var segs = location.pathname.split("/");
        var at = -1;
        for (var i = 1; i < segs.length; i++) {
          if (keys.indexOf(segs[i]) !== -1) {
            at = i;
            break;
          }
        }
        var base =
          at > 0
            ? segs.slice(0, at).join("/") + "/"
            : location.pathname.replace(/[^\/]*$/, "");
        var b = document.createElement("base");
        b.href = base;
        document.head.appendChild(b);
        window.GS_BASE = base;
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f43f8c'/%3E%3Cpath d='M10 22v-5M16 22V10M22 22v-8' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>
    <div id="app" class="app" aria-live="polite"></div>
    <div id="cursors" class="cursors" aria-hidden="true"></div>
    <div id="toasts" class="toasts"></div>

    <!-- Libraries (free CDNs, nothing to install) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@3.0.2/dist/chartjs-plugin-zoom.min.js"></script>

    <!-- Your settings: paste the Firebase config in here -->
    <script src="js/config.js"></script>

    <!-- Graph Studio -->
    <script src="js/icons.js"></script>
    <script src="js/core.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/exporters.js"></script>
    <script src="js/studio.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
