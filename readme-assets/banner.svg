<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Graph Studio: graphs that move, links that share, editing that's live">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 0) scale(760 420)">
      <stop offset="0" stop-color="#3a1f63"/><stop offset="1" stop-color="#3a1f63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 380) scale(700 380)">
      <stop offset="0" stop-color="#173458"/><stop offset="1" stop-color="#173458" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity=".06"/></pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
    <style>
      .t { font-family: 'Figtree', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 7s cubic-bezier(.34,1.56,.64,1) infinite both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .22s } .d3 { animation-delay: .34s } .d4 { animation-delay: .46s } .d5 { animation-delay: .58s } .d6 { animation-delay: .7s }
      @keyframes grow { 0% { transform: scaleY(0); opacity: 1 } 13% { transform: scaleY(1) } 84% { transform: scaleY(1); opacity: 1 } 94% { transform: scaleY(1); opacity: 0 } 100% { transform: scaleY(0); opacity: 0 } }
      .line { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 7s ease-out infinite; }
      @keyframes draw { 0%, 14% { stroke-dashoffset: 620; opacity: 1 } 42% { stroke-dashoffset: 0 } 84% { stroke-dashoffset: 0; opacity: 1 } 94%, 100% { stroke-dashoffset: 0; opacity: 0 } }
      .pt { opacity: 0; animation: pt 7s ease-out infinite; }
      @keyframes pt { 0%, 40% { opacity: 0 } 46%, 84% { opacity: 1 } 94%, 100% { opacity: 0 } }
      .plus { transform-box: fill-box; transform-origin: center; animation: spin 7s cubic-bezier(.34,1.56,.64,1) infinite; }
      @keyframes spin { 0%, 46% { transform: rotate(0deg) } 54%, 78% { transform: rotate(135deg) } 88%, 100% { transform: rotate(0deg) } }
      .fab { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }
      @keyframes breathe { 0%, 44% { transform: scale(1) } 50% { transform: scale(1.12) } 56%, 100% { transform: scale(1) } }
      .c1 { animation: c1 7s ease-in-out infinite; }
      @keyframes c1 { 0% { transform: translate(770px, 136px) } 28% { transform: translate(905px, 96px) } 55% { transform: translate(1000px, 176px) } 80% { transform: translate(840px, 214px) } 100% { transform: translate(770px, 136px) } }
      .c2 { animation: c2 7s ease-in-out infinite; }
      @keyframes c2 { 0% { transform: translate(1060px, 252px) } 30% { transform: translate(975px, 150px) } 58% { transform: translate(880px, 262px) } 82% { transform: translate(1040px, 120px) } 100% { transform: translate(1060px, 252px) } }
      .party { opacity: 0; transform-box: fill-box; transform-origin: center; animation: party 7s ease-out infinite; }
      @keyframes party { 0%, 56% { opacity: 0; transform: translate(0, 10px) scale(.4) } 60% { opacity: 1; transform: translate(0, -6px) scale(1.2) } 72% { opacity: 1; transform: translate(0, -24px) scale(1) } 80%, 100% { opacity: 0; transform: translate(0, -46px) scale(.9) } }
      .chip { animation: chip .9s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: left center; }
      .k2 { animation-delay: .12s } .k3 { animation-delay: .24s }
      @keyframes chip { from { opacity: 0; transform: scale(.7) } }
      .logo { transform-box: fill-box; transform-origin: center; animation: wiggle 7s ease-in-out infinite; }
      @keyframes wiggle { 0%, 6% { transform: rotate(0) } 9% { transform: rotate(-9deg) } 12% { transform: rotate(7deg) } 15% { transform: rotate(-3deg) } 18%, 100% { transform: rotate(0) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .line { stroke-dashoffset: 0 } .pt { opacity: 1 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#121218"/>
    <rect width="1200" height="360" fill="url(#glowA)"/>
    <rect width="1200" height="360" fill="url(#glowB)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>

    <!-- title side -->
    <g class="logo">
      <rect x="64" y="64" width="58" height="58" rx="17" fill="#f43f8c"/>
      <path d="M80 107v-9M93 107V80M106 107V91" stroke="#ffffff" stroke-width="5.6" stroke-linecap="round" fill="none"/>
    </g>
    <text x="62" y="196" class="t" font-size="68" font-weight="800" letter-spacing="-2.6" fill="#f3f3f6">Graph Studio</text>
    <text x="65" y="238" class="t" font-size="22.5" font-weight="500" fill="#a6a6b2">Graphs that move. Links that share. Editing that’s live.</text>
    <g class="t" font-size="15" font-weight="700">
      <g class="chip"><rect x="64" y="268" width="78" height="34" rx="17" fill="#f43f8c" fill-opacity=".16" stroke="#f43f8c" stroke-opacity=".5"/><text x="103" y="290" text-anchor="middle" fill="#ff8fc1">Free</text></g>
      <g class="chip k2"><rect x="152" y="268" width="124" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="214" y="290" text-anchor="middle" fill="#e6e6ec">No terminal</text></g>
      <g class="chip k3"><rect x="286" y="268" width="132" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="352" y="290" text-anchor="middle" fill="#e6e6ec">Live cursors</text></g>
    </g>

    <!-- chart card -->
    <g transform="translate(700 46)">
      <rect width="446" height="268" rx="24" fill="#1f1f26" stroke="#ffffff" stroke-opacity=".08"/>
      <rect x="18" y="16" width="64" height="24" rx="12" fill="#f43f8c"/>
      <text x="50" y="33" class="t" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Bar</text>
      <text x="100" y="33" class="t" font-size="12.5" font-weight="650" fill="#74747f">Line</text>
      <text x="146" y="33" class="t" font-size="12.5" font-weight="650" fill="#74747f">Pie</text>
      <text x="184" y="33" class="t" font-size="12.5" font-weight="650" fill="#74747f">Radar</text>
      <g stroke="#ffffff" stroke-opacity=".06">
        <line x1="24" y1="96" x2="424" y2="96"/><line x1="24" y1="146" x2="424" y2="146"/><line x1="24" y1="196" x2="424" y2="196"/>
      </g>
      <line x1="24" y1="246" x2="424" y2="246" stroke="#ffffff" stroke-opacity=".12"/>
      <rect class="bar d1" x="44"  y="138" width="34" height="108" rx="7" fill="#338ced"/>
      <rect class="bar d2" x="110" y="160" width="34" height="86"  rx="7" fill="#338ced"/>
      <rect class="bar d3" x="176" y="111" width="34" height="135" rx="7" fill="#338ced"/>
      <rect class="bar d4" x="242" y="84"  width="34" height="162" rx="7" fill="#338ced"/>
      <rect class="bar d5" x="308" y="124" width="34" height="122" rx="7" fill="#338ced"/>
      <rect class="bar d6" x="374" y="95"  width="34" height="151" rx="7" fill="#338ced"/>
      <polyline class="line" points="61,169 127,163 193,152 259,137 325,140 391,129" fill="none" stroke="#e76624" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="pt" fill="#e76624" stroke="#1f1f26" stroke-width="3">
        <circle cx="61" cy="169" r="6"/><circle cx="127" cy="163" r="6"/><circle cx="193" cy="152" r="6"/><circle cx="259" cy="137" r="6"/><circle cx="325" cy="140" r="6"/><circle cx="391" cy="129" r="6"/>
      </g>
    </g>

    <!-- the + button -->
    <g transform="translate(1130 300)">
      <g class="fab">
        <circle r="30" fill="#f43f8c"/>
        <g class="plus"><path d="M-11 0h22M0-11v22" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/></g>
      </g>
    </g>

    <!-- two people editing together -->
    <g class="c1">
      <path d="M2.4 1.3c-.7-.4-1.5.2-1.4 1l2.4 17.4c.1.9 1.2 1.2 1.8.5l4.3-5.1c.3-.3.7-.5 1.1-.5l6.6-.3c.9 0 1.3-1.1.7-1.7z" fill="#36b3ff" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
      <rect x="16" y="20" width="44" height="22" rx="11" fill="#36b3ff"/>
      <text x="38" y="35.5" class="t" font-size="12.5" font-weight="750" text-anchor="middle" fill="#0d1a24">Ava</text>
    </g>
    <g class="c2">
      <path d="M2.4 1.3c-.7-.4-1.5.2-1.4 1l2.4 17.4c.1.9 1.2 1.2 1.8.5l4.3-5.1c.3-.3.7-.5 1.1-.5l6.6-.3c.9 0 1.3-1.1.7-1.7z" fill="#2fd39a" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
      <rect x="16" y="20" width="42" height="22" rx="11" fill="#2fd39a"/>
      <text x="37" y="35.5" class="t" font-size="12.5" font-weight="750" text-anchor="middle" fill="#0b1f17">Leo</text>
      <text x="10" y="-6" font-size="26" class="party">🎉</text>
    </g>
  </g>
</svg>
